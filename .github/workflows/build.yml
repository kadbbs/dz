name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux native package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mediasoup-server/package-lock.json

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-system-dev

      - name: Build
        run: bash scripts/linux/build_native.sh --configuration Release --build-dir build-linux

      - name: Package
        run: bash scripts/package_linux.sh --configuration Release --build-dir build-linux --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dz-linux-x64
          path: dist/dz-linux-x64.tar.gz
          if-no-files-found: error

  windows-native:
    name: Windows native package
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: build-windows
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mediasoup-server/package-lock.json

      - name: Bootstrap vcpkg
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Install Windows Boost
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:VCPKG_ROOT\vcpkg.exe" install "boost-system:$env:VCPKG_TRIPLET"

      - name: Configure Windows C++
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          $webRoot = (Resolve-Path "web").Path.Replace("\", "/")
          cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DWEB_ROOT_PATH="$webRoot"

      - name: Build Windows C++
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build $env:BUILD_DIR --config Release

      - name: Install Windows mediasoup deps
        working-directory: mediasoup-server
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --omit=dev

      - name: Prepare Windows package dirs
        run: |
          $packageDir = "dist\dz-windows-x64"
          New-Item -ItemType Directory -Force -Path "$packageDir\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageDir\mediasoup-server" | Out-Null

      - name: Copy Windows game executable
        run: |
          $packageDir = "dist\dz-windows-x64"
          $gameExe = Get-ChildItem -Path "build-windows" -Recurse -Filter "web_texas_webrtc.exe" -File | Select-Object -First 1
          if (-not $gameExe) {
            throw "Could not find web_texas_webrtc.exe under build-windows"
          }
          Copy-Item -Path $gameExe.FullName -Destination "$packageDir\bin\web_texas_webrtc.exe"

      - name: Copy Windows app assets
        run: |
          $packageDir = "dist\dz-windows-x64"
          foreach ($item in @("web", "deploy", "scripts")) {
            Copy-Item -Path $item -Destination $packageDir -Recurse
          }
          foreach ($item in @("README.md", "CMakeLists.txt", "docker-compose.yml")) {
            Copy-Item -Path $item -Destination $packageDir
          }

      - name: Copy Windows mediasoup descriptors
        run: |
          $packageDir = "dist\dz-windows-x64"
          foreach ($item in @("package.json", "package-lock.json", "server.js")) {
            Copy-Item -Path "mediasoup-server\$item" -Destination "$packageDir\mediasoup-server"
          }

      - name: Stage Windows node modules
        run: Move-Item -Path "mediasoup-server\node_modules" -Destination "dist\dz-windows-x64\mediasoup-server\node_modules"

      - name: Write Windows package metadata
        run: |
          $commit = git rev-parse --short HEAD
          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          @(
            "package=dz-windows-x64",
            "configuration=Release",
            "commit=$commit",
            "built_at=$builtAt"
          ) | Set-Content -Encoding UTF8 "dist\dz-windows-x64\VERSION.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dz-windows-x64
          path: dist/dz-windows-x64
          if-no-files-found: error

  docker:
    name: Docker Compose build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose --env-file deploy/dz.container.env.example build
