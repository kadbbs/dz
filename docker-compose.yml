services:
  game:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.game
    restart: unless-stopped
    environment:
      DZ_LISTEN_HOST: "::"
      DZ_WEB_PORT: "${DZ_WEB_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/${DZ_WEB_PORT:-8080}'"]
      interval: 30s
      timeout: 5s
      retries: 3

  mediasoup:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.mediasoup
    restart: unless-stopped
    environment:
      MEDIASOUP_SIGNAL_HOST: "::"
      MEDIASOUP_SIGNAL_PORT: "${MEDIASOUP_SIGNAL_PORT:-3001}"
      MEDIASOUP_LISTEN_IP: "${MEDIASOUP_LISTEN_IP:-0.0.0.0}"
      MEDIASOUP_ANNOUNCED_IP: "${MEDIASOUP_ANNOUNCED_IP}"
      MEDIASOUP_PREFER_IPV6: "${MEDIASOUP_PREFER_IPV6:-true}"
      MEDIASOUP_MIN_PORT: "${MEDIASOUP_MIN_PORT:-40000}"
      MEDIASOUP_MAX_PORT: "${MEDIASOUP_MAX_PORT:-40100}"
    ports:
      - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}/udp"
      - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}/tcp"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.MEDIASOUP_SIGNAL_PORT || 3001) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - game
      - mediasoup
    environment:
      DZ_DOMAIN: "${DZ_DOMAIN}"
      DZ_WEB_PORT: "${DZ_WEB_PORT:-8080}"
      MEDIASOUP_SIGNAL_PORT: "${MEDIASOUP_SIGNAL_PORT:-3001}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
